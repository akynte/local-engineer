# Docs site (design v3 §1.1: "a `docs/` site built from Markdown is preferred
# over a wiki", and §15's "Docs site (Diátaxis)").
#
# The site is a *view* of docs/, never a second source. Every page here is a
# file that reads correctly on GitHub too, because the repository is where
# people actually find documentation and a site that reformats its source is a
# second thing to keep true.
#
# Build:  pip install mkdocs mkdocs-material && mkdocs serve
site_name: local-engineer
site_description: A supervised local coding engineer with per-workspace isolation
repo_url: https://github.com/akynte/local-engineer
repo_name: akynte/local-engineer
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# The Diátaxis split of §1.1, in the order a reader needs it: learn, then do,
# then look up, then understand why.
