# A 9B-class dense model held entirely in 8 GB of VRAM (design v3 §9.2).
# Faster per token than the MoE reference profile and strictly smaller, so the
# packet cap is lower.
name: resident-8gb-cuda
description: >-
  9B-class dense model fully resident on an 8 GB GPU. Unmeasured starting
  points; run `le models bench --write` to replace them.
hardware:
  gpu: 8 GB CUDA
  vram_mb: 8188
  ram_mb: 32768
  threads: 8
context_tokens: 16384
max_packet_tokens: 6000
reserved_output_tokens: 4096
max_tools_exposed: 10
measured_peak_vram_mb: 0
measured_peak_ram_mb: 0
max_concurrent_tasks: 1
runtime:
  threads: 8
  gpu_layers: 999
  batch_size: 1024
  ubatch_size: 512
  flash_attn: true
  cache_type_k: q8_0
  cache_type_v: q8_0
  slots: 1
sampling:
  temperature: 0.2
  top_p: 0.95
  top_k: 40
  min_p: 0.05
thinking_policy: auto
