# golangci-lint configuration. The set is deliberately modest: linters that
# produce a steady stream of low-value findings train people to ignore the
# output, which costs more than the bugs they catch.
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck        # an unchecked error here is a silently lost side effect
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - bodyclose       # an unclosed provider response leaks a connection per call
    - rowserrcheck    # a missed rows.Err() silently truncates a query result
    - sqlclosecheck
    - contextcheck
    - errorlint       # errors.Is/As rather than == and type assertions
    - copyloopvar
    - nilerr
    - noctx           # every outbound HTTP call must be cancellable
    - unconvert
    - usestdlibvars
    - gosec
  disable:
    # Style linters that would fight the design's long, explanatory comments.
    - lll
    - funlen
    - gocognit
    - cyclop
    - wsl
    - nlreturn
    - varnamelen
    - exhaustruct
    - depguard

linters-settings:
  errcheck:
    check-type-assertions: true
    exclude-functions:
      # Deferred closes on read paths and best-effort cleanup.
      - (io.Closer).Close
      - (*database/sql.Rows).Close
  gosec:
    excludes:
      # G104 duplicates errcheck.
      - G104
      # File permissions are set deliberately and reviewed in internal/store.
      - G306
  govet:
    enable-all: true
    disable:
      - fieldalignment   # readability of these structs beats a few bytes
      - shadow

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters: [gosec, errcheck, noctx, bodyclose]
    # The analyzer intentionally names the functions it forbids.
    - path: tools/analyzers/
      linters: [gosec]
