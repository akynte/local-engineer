# Every gate listed in design v3 §1.2 runs here on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The default token is read-only; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.3"

jobs:
  lint:
    name: Format, vet, lint, storescope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: storescope (design v3 §2.3 isolation rule)
        run: |
          # sql.Open and file writes must stay inside internal/store and
          # internal/artifacts, or workspace isolation becomes a convention.
          go run ./tools/analyzers/storescope/cmd/storescope ./...

      - uses: golangci/golangci-lint-action@971e284b6050e8a5849b72094c50ab08da042db8 # v6.1.1
        with:
          version: v1.62.2
          args: --timeout=5m

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2024.1.1
          staticcheck ./...

  test:
    name: Unit tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Report the kernel's Landlock ABI
        run: |
          # The sandbox tests skip with a reason when Landlock is unavailable.
          # Recording the ABI here means a skipped test is visible, not silent.
          echo "kernel: $(uname -r)"
          grep -o 'landlock' /sys/kernel/security/lsm 2>/dev/null || echo "landlock not in the active LSM list"

      - name: go test -race
        run: go test -race -timeout 10m -coverprofile=coverage.out ./...

      - name: Coverage (reported, not gated)
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        if: always()
        with:
          name: coverage
          path: coverage.out

  isolation:
    name: Workspace isolation (design v3 §2.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Isolation tests
        run: go test -race -v -run 'Isolation|CrossWorkspace|Workspace|Guard|Cache' ./internal/store/...

      - name: The isolation tests must be able to fail
        # A test that cannot fail protects nothing. The script breaks the
        # cache's workspace binding, requires the suite to notice, and verifies
        # its own mutation applied so a refactor cannot turn it into a no-op.
        run: ./scripts/verify-isolation-can-fail.sh

  schemas:
    name: Schema and policy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Every embedded migration applies cleanly
        run: go test -run TestMigrations ./internal/store/...

      - name: Every shipped profile parses and validates
        run: go test -run TestShippedProfiles ./internal/config/...

      - name: Compose files are valid
        run: |
          docker compose -f deploy/docker-compose.yml config -q
          LE_MODEL=placeholder.gguf docker compose -f deploy/docker-compose.split.yml config -q

  fuzz:
    name: Short fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fuzz targets, 30s each
        run: |
          # Long runs happen nightly; this catches a regression on the PR.
          for pkg in ./internal/retrieval ./internal/workspace; do
            for target in $(go test -list 'Fuzz.*' $pkg 2>/dev/null | grep '^Fuzz' || true); do
              echo "::group::$pkg $target"
              go test -run '^$' -fuzz "^${target}$" -fuzztime=30s "$pkg"
              echo "::endgroup::"
            done
          done

  vuln:
    name: Vulnerability scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@75ab1b8ea6e30f7fc2e6a5aa00c825b39d48ca7e # v1.9.1
        with:
          scan-args: |-
            --lockfile=go.mod
            --recursive
            ./

      - name: gitleaks
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image build (${{ matrix.target }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: slim
            platform: linux/amd64
          - target: cpu
            platform: linux/amd64
          - target: cpu
            platform: linux/arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.platform == 'linux/amd64' }}
          tags: local-engineer:ci-${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform }}
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}

      # Design v3 §14, Phase 0 exit condition: the CPU image starts and passes
      # /readyz. This is the gate, not a smoke test.
      - name: The image starts and passes /readyz
        if: matrix.platform == 'linux/amd64'
        run: |
          set -euo pipefail
          docker volume create le-ci-data
          docker run --rm -v le-ci-data:/data alpine chown -R 10001:10001 /data
          docker run -d --name le-ci \
            -v le-ci-data:/data \
            -p 127.0.0.1:7777:7777 \
            local-engineer:ci-${{ matrix.target }}

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7777/readyz >/dev/null 2>&1; then
              echo "ready after ${i}s"
              curl -fsS http://127.0.0.1:7777/readyz
              echo "--- isolation layers actually in effect ---"
              curl -fsS http://127.0.0.1:7777/v1/sandbox
              docker rm -f le-ci >/dev/null
              docker volume rm le-ci-data >/dev/null
              exit 0
            fi
            sleep 1
          done

          echo "::error::the image never became ready"
          docker logs le-ci
          exit 1

  docs:
    name: Documentation commands execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # Design v3 §4.5: each how-to page has a copy-paste command block and an
      # expected-output block, and CI executes them. A stale command in the
      # documentation fails the build.
      - name: Execute the documented command blocks
        run: go test -tags=docs -run TestDocumentedCommands ./docs/...

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          # The changelog is generated from these, so the format is a gate.
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: .{1,}'
          failed=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::Not a Conventional Commit: $subject"
              failed=1
            fi
          done < <(git rev-list origin/${{ github.base_ref }}..HEAD)
          exit $failed
