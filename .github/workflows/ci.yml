# Every gate listed in design v3 §1.2 runs here on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The default token is read-only; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.3"

jobs:
  lint:
    name: Format, vet, lint, storescope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: storescope (design v3 §2.3 isolation rule)
        run: |
          # sql.Open and file writes must stay inside internal/store and
          # internal/artifacts, or workspace isolation becomes a convention.
          go run ./tools/analyzers/storescope/cmd/storescope ./...

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # v2: the configuration format changed, and v1 does not build under
          # Go 1.26. .golangci.yml is a v2 config.
          version: v2.13.2
          args: --timeout=6m

      - name: staticcheck
        run: |
          # Releases before v0.8 do not build under Go 1.26: their pinned
          # x/tools predates a language change and fails to compile.
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...

  test:
    name: Unit tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Report the kernel's Landlock ABI
        run: |
          # The sandbox tests skip with a reason when Landlock is unavailable.
          # Recording the ABI here means a skipped test is visible, not silent.
          echo "kernel: $(uname -r)"
          grep -o 'landlock' /sys/kernel/security/lsm 2>/dev/null || echo "landlock not in the active LSM list"

      - name: go test -race
        run: go test -race -timeout 10m -coverprofile=coverage.out ./...

      - name: Coverage (reported, not gated)
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        if: always()
        with:
          name: coverage
          path: coverage.out

  isolation:
    name: Workspace isolation (design v3 §2.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Isolation tests
        run: go test -race -v -run 'Isolation|CrossWorkspace|Workspace|Guard|Cache' ./internal/store/...

      # §6.1's proxy and its provisioning lanes are a security boundary, so the
      # allowlist is tested as attempts to get past it — suffix and prefix
      # attacks, trailing dots, wildcard apexes, lane crossing — and the lane
      # spec is tested for granting the proxy port and nothing else.
      - name: Egress allowlist and provisioning lane confinement
        run: go test -race -v ./internal/proxy/...

      # §2.2 permits the aggregate to hold "counters, never content". The row
      # shape is the enforcement, so the column set is asserted: adding a
      # column is exactly how that would stop being true.
      - name: The telemetry aggregate carries no content
        run: go test -race -run 'Aggregate|Content|Forget|DoubleCount' ./internal/telemetry/...

      - name: The isolation tests must be able to fail
        # A test that cannot fail protects nothing. The script breaks the
        # cache's workspace binding, requires the suite to notice, and verifies
        # its own mutation applied so a refactor cannot turn it into a no-op.
        run: ./scripts/verify-isolation-can-fail.sh

  taskset:
    name: Evaluation task set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Every task must measure something and be solvable
        # A task whose acceptance already passes measures nothing; a task with
        # no reference solution may be unsolvable, and every arm would score
        # zero on it for reasons unrelated to the system.
        run: go test -run 'TestShippedTaskSet|TestObjectives|TestFixtures|TestAcceptanceFails|TestKnownGood' ./internal/eval/

  schemas:
    name: Schema and policy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Every embedded migration applies cleanly
        run: go test -run TestMigrations ./internal/store/...

      - name: Every shipped profile parses and validates
        run: go test -run TestShippedProfiles ./internal/config/...

      # §1.2: "all JSON Schemas compile". The third of these also checks the
      # schemas against the loader, so the two cannot drift apart and start
      # disagreeing about what a valid file is.
      - name: JSON Schemas compile and agree with the loader
        run: go test -run 'TestSchemas|TestSchemaAndLoaderAgree|TestShippedTasksValidate|TestDefaultConfigValidates|TestDefaultProvidersValidate|TestShippedProfilesValidateAgainstSchema' ./internal/config/...

      - name: Compose files are valid
        run: |
          docker compose -f deploy/docker-compose.yml config -q
          LE_MODEL=placeholder.gguf docker compose -f deploy/docker-compose.split.yml config -q

      # Every release attaches this snapshot, so it must not drift away from the
      # results it claims to summarise.
      - name: The benchmark snapshot is current
        run: make benchmarks-check

  sidecar:
    name: Sidecar tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sidecars/typescript/package-lock.json

      # §1.2 lists sidecar tests as a gate. The sidecar is what gives
      # TypeScript compiler-backed edges rather than a lexical reading, so its
      # own tests are the only thing standing behind that difference.
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: sidecars/typescript

      - name: Test
        run: npm test
        working-directory: sidecars/typescript

  split-layout:
    name: Split deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # DR-1 promised a maintained multi-container alternative to the single
      # container. Validating the file's syntax proves nothing about whether it
      # works; this brings it up against a stub inference service and checks the
      # claim it actually makes — that pointing the supervisor at an external
      # inference container is a configuration change only.
      - name: Build the image under test
        run: docker build -f deploy/Dockerfile --target cpu -t local-engineer:ci .

      - name: The split layout runs external inference over HTTP
        run: LE_IMAGE=local-engineer:ci scripts/check-split-layout.sh

  fuzz:
    name: Short fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fuzz targets, 30s each
        run: |
          # Long runs happen nightly; this catches a regression on the PR.
          for pkg in ./internal/retrieval ./internal/workspace; do
            for target in $(go test -list 'Fuzz.*' $pkg 2>/dev/null | grep '^Fuzz' || true); do
              echo "::group::$pkg $target"
              go test -run '^$' -fuzz "^${target}$" -fuzztime=30s "$pkg"
              echo "::endgroup::"
            done
          done

  vuln:
    name: Vulnerability scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@75ab1b8ea6e30f7fc2e6a5aa00c825b39d48ca7e # v1.9.1
        with:
          scan-args: |-
            --lockfile=go.mod
            --recursive
            ./

      - name: gitleaks
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image build (${{ matrix.target }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: slim
            platform: linux/amd64
          - target: cpu
            platform: linux/amd64
          - target: cpu
            platform: linux/arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.platform == 'linux/amd64' }}
          tags: local-engineer:ci-${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform }}
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}

      # Design v3 §14, Phase 0 exit condition: the CPU image starts and passes
      # /readyz. This is the gate, not a smoke test.
      - name: The image starts and passes /readyz
        if: matrix.platform == 'linux/amd64'
        run: |
          set -euo pipefail
          docker volume create le-ci-data
          docker run --rm -v le-ci-data:/data alpine chown -R 10001:10001 /data
          docker run -d --name le-ci \
            -v le-ci-data:/data \
            -p 127.0.0.1:7777:7777 \
            local-engineer:ci-${{ matrix.target }}

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7777/readyz >/dev/null 2>&1; then
              echo "ready after ${i}s"
              curl -fsS http://127.0.0.1:7777/readyz
              echo "--- isolation layers actually in effect ---"
              curl -fsS http://127.0.0.1:7777/v1/sandbox
              docker rm -f le-ci >/dev/null
              docker volume rm le-ci-data >/dev/null
              exit 0
            fi
            sleep 1
          done

          echo "::error::the image never became ready"
          docker logs le-ci
          exit 1

      # The TypeScript sidecar has to be IN the image, not merely in the
      # repository. It was not, and nothing caught it: a missing sidecar is an
      # ordinary condition the analyzer survives by falling back to the lexical
      # reading, so the only visible symptom was TypeScript quietly having no
      # call graph. A `calls` edge is the precise gate — the lexical reader
      # emits none by design, so this edge exists only if the sidecar ran.
      - name: The image's TypeScript sidecar produces compiler-backed edges
        if: matrix.target == 'cpu' && matrix.platform == 'linux/amd64'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash local-engineer:ci-cpu -euc '
            export LE_DATA=$(mktemp -d)
            repo=$(mktemp -d); cd "$repo"
            git init -q .
            printf "export function f(): number { return 1; }\nexport function g(): number { return f(); }\n" > app.ts
            le workspace init >/dev/null
            le index 2>&1 | tee /tmp/index.log
            if grep -q "sidecar is not installed" /tmp/index.log; then
              echo "::error::the image ships Node but no TypeScript sidecar" >&2
              exit 1
            fi
            le graph stats | tee /tmp/stats.txt
            grep -qE "^  calls " /tmp/stats.txt || {
              echo "::error::no TypeScript call edges; the sidecar did not run" >&2
              exit 1
            }
          '

      # §4.2 lists golangci-lint and semgrep in the image; neither was there,
      # so the semgrep recipe skipped on every published image and §10.1's
      # lint leg had nothing to run. The engine has no shell tool — its only
      # route to an external program is run_recipe — so a tool missing from
      # the image is unreachable, not "install it yourself".
      - name: The image can run the lint and analyzer recipes
        if: matrix.target == 'cpu' && matrix.platform == 'linux/amd64'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash local-engineer:ci-cpu -euc '
            export LE_DATA=$(mktemp -d)
            repo=$(mktemp -d); cd "$repo"
            git init -q .
            printf "module example.test/p\n\ngo 1.26\n" > go.mod
            printf "package p\n\nfunc F() int { return 1 }\n" > p.go
            printf "version: \"2\"\n" > .golangci.yml
            mkdir -p semgrep
            cat > semgrep/rules.yaml <<YAML
          rules:
            - id: never-matches
              # The regex must not match its own text in this file: semgrep
              # scans the rule directory too, and a self-matching pattern
              # makes the fixture fail rather than the check.
              pattern-regex: le_probe_[0-9]{32}
              message: placeholder rule so the recipe has something to run
              languages: [generic]
              severity: INFO
          YAML
            git add -A
            git -c user.email=ci@local -c user.name=ci commit -qm init
            le workspace init >/dev/null
            le task verify --verify high --json > /tmp/verify.json
            python3 - <<PY
          import json, sys
          r = json.load(open("/tmp/verify.json"))
          kinds = {x["kind"]: x["status"] for x in r["results"]}
          missing = [k for k in ("lint", "analyzer") if k not in kinds]
          if missing:
              print("::error::recipes never ran: %s; kinds present: %s" % (missing, sorted(kinds)))
              sys.exit(1)
          bad = {k: v for k, v in kinds.items() if k in ("lint", "analyzer") and v != "pass"}
          if bad:
              print("::error::a check did not pass on a clean fixture: %s" % bad)
              sys.exit(1)
          if not r["accepted"]:
              print("::error::clean fixture was not accepted: %s" % r["reasons"])
              sys.exit(1)
          print("lint and analyzer recipes ran and passed")
          PY
          '

  docs:
    name: Documentation commands execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # Design v3 §4.5: each how-to page has a copy-paste command block and an
      # expected-output block, and CI executes them. A stale command in the
      # documentation fails the build.
      - name: Execute the documented command blocks
        run: go test -tags=docs -run TestDocumentedCommands ./docs/...

      # §1.1 prefers "a docs/ site built from Markdown over a wiki", and §15
      # requires one. --strict fails on a broken internal link or a page the
      # nav does not list, which is how a site view of docs/ drifts from it.
      - name: The docs site builds
        run: |
          python3 -m pip install --quiet mkdocs==1.6.1 mkdocs-material==9.5.49 pymdown-extensions==10.12
          mkdocs build --strict --site-dir /tmp/site
          echo "built $(find /tmp/site -name '*.html' | wc -l) pages"

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          # The changelog is generated from these, so the format is a gate.
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: .{1,}'
          failed=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::Not a Conventional Commit: $subject"
              failed=1
            fi
          done < <(git rev-list origin/${{ github.base_ref }}..HEAD)
          exit $failed
