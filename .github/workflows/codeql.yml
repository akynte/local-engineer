name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds an old bug.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    # A pull request opened by Dependabot runs with a read-only token and no
    # access to secrets, by GitHub's design. `security-events: write` is
    # therefore unobtainable there and the upload at the end of `analyze`
    # fails — not because anything is wrong with the code, which init and
    # autobuild have already compiled by that point. Every dependency bump
    # would carry a red check that means nothing, which is how a maintainer
    # learns to stop reading them. The push to main covers the merged result,
    # and that is the run the security tab is built from.
    #
    # And skipped entirely while the repository is private. The analysis itself
    # runs fine there; the upload at the end does not, because code scanning on
    # a private repository needs GitHub Advanced Security. Without it the job
    # burns several minutes of CodeQL evaluation and then fails on the last
    # step, every push — which is the same permanently-red check the Dependabot
    # rule above exists to avoid, for a different reason. It resumes by itself
    # when the repository is made public.
    if: github.actor != 'dependabot[bot]' && github.event.repository.private == false
    permissions:
      # A job-level block replaces the workflow-level one rather than merging
      # with it, so `contents: read` has to be repeated here. Omitting it worked
      # only while the repository was public, where checkout needs no permission
      # at all; the moment it went private, checkout failed with "repository not
      # found" — which reads as an infrastructure fault rather than a missing
      # scope, and had nothing to do with CodeQL.
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.8"
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: go
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
