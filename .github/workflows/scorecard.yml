# OpenSSF Scorecard: the public supply-chain signal named in design v3 §1.1.
# Phase 0's exit condition is that this runs on main.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "19 5 * * 2"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # v2.4.x moved the published image from gcr.io/openssf to
      # ghcr.io/ossf; the pin below is the first one this repository used
      # that pulls from where the image actually is.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing the result is what makes the badge and the public
          # signal real rather than a private self-assessment.
          publish_results: true

      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          sarif_file: results.sarif
