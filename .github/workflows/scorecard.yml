# OpenSSF Scorecard: the public supply-chain signal named in design v3 §1.1.
# Phase 0's exit condition is that this runs on main.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "19 5 * * 2"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard reads commit history through GitHub's GraphQL API, which refuses
    # an integration token on a private repository: the run ends in "Resource
    # not accessible by integration" whatever permissions it is given. Skipping
    # is better than a permanently red check that means only "this repository is
    # private" — a check a maintainer learns to ignore stops working as a check.
    # It resumes by itself if the repository is made public again.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # v2.4.x moved the published image from gcr.io/openssf to
      # ghcr.io/ossf; the pin below is the first one this repository used
      # that pulls from where the image actually is.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing the result is what makes the badge and the public
          # signal real rather than a private self-assessment.
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
