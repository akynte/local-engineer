name: Nightly fuzz

on:
  schedule:
    - cron: "13 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Long fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        package: ["./internal/retrieval", "./internal/workspace", "./internal/graph"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: "1.26.8"

      - name: Fuzz for 20 minutes per target
        run: |
          for target in $(go test -list 'Fuzz.*' ${{ matrix.package }} 2>/dev/null | grep '^Fuzz' || true); do
            echo "::group::${{ matrix.package }} $target"
            go test -run '^$' -fuzz "^${target}$" -fuzztime=20m ${{ matrix.package }}
            echo "::endgroup::"
          done

      - name: Upload any crashers
        if: failure()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: fuzz-corpus-${{ strategy.job-index }}
          path: |
            **/testdata/fuzz/**
