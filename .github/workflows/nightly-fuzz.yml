name: Nightly fuzz

on:
  schedule:
    - cron: "13 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Long fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        package: ["./internal/retrieval", "./internal/workspace", "./internal/graph"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.8"

      - name: Fuzz for 20 minutes per target
        run: |
          for target in $(go test -list 'Fuzz.*' ${{ matrix.package }} 2>/dev/null | grep '^Fuzz' || true); do
            echo "::group::${{ matrix.package }} $target"
            go test -run '^$' -fuzz "^${target}$" -fuzztime=20m ${{ matrix.package }}
            echo "::endgroup::"
          done

      - name: Upload any crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus-${{ strategy.job-index }}
          path: |
            **/testdata/fuzz/**
