# Benchmark tracking against the base branch (design v3 §1.1, §5.3).
name: Benchmarks

on:
  pull_request:
    paths:
      - "internal/store/**"
      - "internal/graph/**"
      - "internal/retrieval/**"
      - "evals/**"
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: benchstat against the base branch
    runs-on: ubuntu-latest
    # The comparison is written to the job summary, not posted as a comment,
    # so this job needs nothing beyond reading the code.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.8"

      - run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Benchmark this branch
        run: go test -run '^$' -bench . -benchmem -count 6 ./evals/... | tee /tmp/new.txt

      - name: Benchmark the base branch
        if: github.event_name == 'pull_request'
        run: |
          git stash push --include-untracked || true
          git checkout -q "origin/${{ github.base_ref }}"
          go test -run '^$' -bench . -benchmem -count 6 ./evals/... | tee /tmp/old.txt
          git checkout -q -
          git stash pop || true

      - name: Compare
        if: github.event_name == 'pull_request'
        run: |
          benchstat /tmp/old.txt /tmp/new.txt | tee /tmp/delta.txt
          {
            echo "## Benchmark comparison"
            echo
            echo "Reported as a diagnostic, not a gate. CI runners are noisy;"
            echo "treat a change under ~10% as noise unless it reproduces."
            echo
            echo '```'
            cat /tmp/delta.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks
          path: /tmp/new.txt
