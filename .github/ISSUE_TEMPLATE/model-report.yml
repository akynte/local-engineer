name: Model report
description: Report how a specific model performs, to build the compatibility table
labels: ["model-report"]
body:
  - type: markdown
    attributes:
      value: |
        Model reports are how the compatibility table gets built. Even a
        negative result is useful — "this model cannot hold a tool call
        together" saves the next person an evening.

  - type: input
    id: model
    attributes:
      label: Model
      placeholder: "Qwen3-Coder-30B-A3B"
    validations:
      required: true

  - type: input
    id: quant
    attributes:
      label: Quantisation and file
      placeholder: "Q4_K_M, 17.3 GB GGUF"
    validations:
      required: true

  - type: input
    id: profile
    attributes:
      label: Hardware profile
      description: The profile name, or "generated by le models bench".
      placeholder: "reference-8gb-cuda-64gb-ram"
    validations:
      required: true

  - type: textarea
    id: bench
    attributes:
      label: "`le models bench --json` output"
      description: >-
        Prefill and decode throughput, peak memory and prompt-cache reuse,
        measured on your machine.
      render: json
    validations:
      required: true

  - type: dropdown
    id: capabilities
    attributes:
      label: What worked
      multiple: true
      options:
        - Tool calling held together over a multi-step task
        - Structured output matched the schema
        - Grammar-constrained generation
        - Fill-in-the-middle
        - Stayed on task without drifting
        - Produced compiling code on the first attempt more often than not

  - type: textarea
    id: failures
    attributes:
      label: Where it failed
      description: Be specific. "Lost the tool schema after ~6 turns" is useful; "it was bad" is not.

  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      placeholder: "RTX 4060 Laptop 8 GB, 64 GB RAM, Ryzen 7 7840HS, Ubuntu 26.04, driver 580.x"
    validations:
      required: true
