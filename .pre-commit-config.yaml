# Optional local hooks. CI is the gate; these just shorten the feedback loop.
#   pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: storescope
        name: "storescope (design v3 §2.3 isolation rule)"
        entry: go run ./tools/analyzers/storescope/cmd/storescope ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: conventional-commit
        name: Conventional Commits
        entry: >-
          bash -c 'grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: "
          "$1" || { echo "Commit message must follow Conventional Commits."; exit 1; }' --
        language: system
        stages: [commit-msg]
